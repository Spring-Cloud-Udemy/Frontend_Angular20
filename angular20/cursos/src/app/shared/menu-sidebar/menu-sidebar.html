@if (!preference.visible()) {
  <button
    type="button"
    class="sidebar-open-button"
    aria-label="Mostrar menú"
    title="Mostrar menú"
    aria-expanded="false"
    (click)="preference.setVisible(true)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
}

@if (preference.visible()) {
  <aside
    id="primary-sidebar"
    class="sidebar"
    [class.collapsed]="preference.collapsed()"
    [style.width]="preference.collapsed() ? 'var(--sidebar-collapsed-width)' : 'var(--sidebar-width)'"
  >
    <div class="sidebar-heading">
      <a class="brand" routerLink="/alumnos" aria-label="Aula, inicio">
        <span class="brand-mark">E</span><span class="brand-name">Cursos<span>.</span></span>
      </a>
      <button
        type="button"
        class="sidebar-collapse-button"
        [attr.aria-label]="preference.collapsed() ? 'Expandir menú' : 'Contraer menú'"
        [attr.title]="preference.collapsed() ? 'Expandir menú' : 'Contraer menú'"
        aria-controls="primary-sidebar"
        [attr.aria-expanded]="!preference.collapsed()"
        (click)="preference.toggleCollapsed()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (preference.collapsed()) {
            <path d="m9 18 6-6-6-6M4 5v14" />
          } @else {
            <path d="m15 18-6-6 6-6M20 5v14" />
          }
        </svg>
      </button>
      <button
        type="button"
        class="sidebar-close-button"
        aria-label="Ocultar menú"
        (click)="preference.setVisible(false)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
    <div class="workspace-label">ESPACIO DE TRABAJO</div>
    <nav class="main-nav" aria-label="Navegación principal">
      <a
        class="nav-item"
        routerLink="/alumnos"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        title="Alumnos"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20m7-9a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
        </svg>
        <span>Alumnos</span><span class="nav-count">{{ alumnoCount() ?? '—' }}</span>
      </a>
      <a
        class="nav-item"
        routerLink="/cursos"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        title="Cursos"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Zm0 0v16M8 7h8m-8 4h8" />
        </svg>
        <span>Cursos</span><span class="nav-count">{{ cursoCount() ?? '—' }}</span>
      </a>
    </nav>
    @if (countError()) {
      <p class="count-error" role="status">No fue posible actualizar los contadores.</p>
    }
    <div class="sidebar-bottom">
      <div class="help-card">
        <span class="help-icon">?</span>
        <div><strong>¿Necesitas ayuda?</strong><span>Estamos aquí para ti.</span></div>
      </div>
      <div class="profile">
        <div class="avatar avatar-admin">AD</div>
        <div class="profile-copy"><strong>Administrador</strong><span>Panel de gestión</span></div>
      </div>
    </div>
  </aside>
}
